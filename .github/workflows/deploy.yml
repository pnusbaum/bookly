name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGION: europe-west1
  SERVICE: bookly
  IMAGE: europe-west1-docker.pkg.dev/bookly-pn/bookly/bookly
  WIF_PROVIDER: projects/610029244011/locations/global/workloadIdentityPools/github/providers/bookly-repo
  DEPLOYER_SA: bookly-deployer@bookly-pn.iam.gserviceaccount.com
  RUNTIME_SA: bookly-runtime@bookly-pn.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Bookly.Web/package-lock.json

      - name: Lint frontend
        working-directory: src/Bookly.Web
        run: |
          npm ci
          npm run lint

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: docker build -t ${{ env.IMAGE }}:${{ github.sha }} .

      - name: Push image
        run: docker push ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: >
          gcloud run deploy ${{ env.SERVICE }}
          --image=${{ env.IMAGE }}:${{ github.sha }}
          --region=${{ env.REGION }}
          --service-account=${{ env.RUNTIME_SA }}
          --min-instances=0
          --max-instances=1
          --memory=512Mi
          --cpu=1
          --quiet

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} --region=${{ env.REGION }} --format='value(status.url)')
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$URL/api/health"